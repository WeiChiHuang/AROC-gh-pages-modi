<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title"><title id="title">Safety net control workflow schematic</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#185caa"/></marker></defs><rect width="1000" height="340" rx="16" fill="#f3f7fc"/><g fill="white" stroke="#8eb3df" stroke-width="2"><rect x="25" y="125" width="200" height="90" rx="10"/><rect x="295" y="110" width="330" height="120" rx="10"/><rect x="720" y="35" width="255" height="100" rx="10"/><rect x="720" y="205" width="255" height="100" rx="10"/></g><g stroke="#185caa" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M225 170H287"/><path d="M625 150H660V85H712"/><path d="M625 190H660V255H712"/></g><g fill="#183552" font-family="Arial,sans-serif" text-anchor="middle"><g font-size="20" font-weight="bold"><text x="125" y="162">Comfort controller</text><text x="460" y="148">Reachability check</text><text x="848" y="76">Use comfort controller</text><text x="848" y="246">Use safety controller</text></g><g font-size="16"><text x="125" y="190">Propose an input</text><text x="460" y="181">Constraints + safety envelope</text><text x="460" y="208">Repeat at each sampling step</text><text x="848" y="104">Conditions satisfied</text><text x="848" y="274">Fallback when check fails</text></g></g></svg>
